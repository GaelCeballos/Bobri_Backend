; Ajustes de PHP para Bobri (se copian a la imagen en el Dockerfile)

; Fotos de tickets: el front las reduce a ~300 KB, pero una foto sin reducir del celular
; pesa 3–5 MB. Laravel valida el máximo real (5 MB); este tope solo evita que PHP la
; rechace antes. post_max_size debe ser mayor: incluye la foto y los demás campos.
upload_max_filesize = 6M
post_max_size = 8M

; Abrir una foto de 12 megapíxeles para reprocesarla ocupa ~60 MB de memoria
memory_limit = 256M
